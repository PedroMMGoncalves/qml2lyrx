[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qml2lyrx"
version = "0.1.0"
description = "Convert QGIS layer styles (.qml) into ArcGIS Pro layer files (.lyrx) and styles (.stylx)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pedro Goncalves" }]
keywords = ["qgis", "arcgis-pro", "qml", "lyrx", "stylx", "cim", "symbology", "gis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.scripts]
qml2lyrx = "qml2lyrx:main"

[project.urls]
Homepage = "https://github.com/PedroMMGoncalves/qml2lyrx"
Repository = "https://github.com/PedroMMGoncalves/qml2lyrx"
Changelog = "https://github.com/PedroMMGoncalves/qml2lyrx/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["qml2lyrx"]
